[package]
name = "ghax"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Attach to your real Chrome or Edge via CDP and drive it — Rust CLI."

[lints]
workspace = true

[package.metadata.wix]
upgrade-guid = "7D2A2B7C-7953-427A-9DF7-C0D2B2817671"
path-guid = "A10569BC-E257-43AE-A11E-22C33FC18CBB"
license = false
eula = false

[[bin]]
name = "ghax"
path = "src/main.rs"

[dependencies]
# Hand-rolled argv parser mirrors TS cli.ts exactly — see args.rs. clap was
# considered but its strict validation conflicts with the dynamic verb surface
# (every verb takes a different flag set, and the daemon owns the schema).
# TLS: rustls with the ring provider. reqwest 0.13's default `rustls` feature
# pulls aws-lc-rs (C/cmake toolchain, breaks the cargo-dist cross targets), so
# we take `rustls-no-provider` and enable ring on rustls ourselves. reqwest
# panics on the first Client unless a provider is installed: main() does it.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps daemon-emitted object key order (matches JSON.stringify in Bun).
# The parity test diffs byte-for-byte, so alphabetized keys would break it.
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
# ctrlc: SIGINT handler for `canary` poll loop. Needed because std::thread::sleep
# is not interruptible — ctrlc sets an AtomicBool that the sleep loop checks every
# 250 ms (same pattern as the TS canary which uses 250 ms setTimeout ticks).
ctrlc = { version = "3", features = ["termination"] }
# rustyline: shell-mode REPL — history + Ctrl-C handling. ~1MB binary cost.
rustyline = "18"
# url: standard URL parsing — used by qa.rs to resolve crawl-mode hrefs
# against a base. Already in the tree transitively via reqwest, so pulling
# it in directly adds no wall-clock cost to builds.
url = "2"
# urlencoding: tiny percent-encoding crate for the one place dispatch.rs
# needs it (ext inspect). Replaces a hand-rolled byte table.
urlencoding = "2"
# sha2: pure-Rust SHA-256 for verifying self-healed daemon-bundle downloads
# in attach.rs (see resolve_daemon_bundle). No C toolchain/OpenSSL dependency,
# so it doesn't disturb the cargo-dist cross-compile targets.
sha2 = "0.11"
# getrandom: OS CSPRNG for the bridge pairing code. That code is an auth secret
# (it gates who can drive the browser), so it MUST be unpredictable — a clock/pid
# mix is computable by a local attacker. Already in the tree via rustls; pinning
# it directly keeps the intent explicit. Pure Rust, no C toolchain.
getrandom = "0.4"
