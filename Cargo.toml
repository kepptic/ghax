[workspace]
resolver = "3"
members = ["crates/cli"]

[workspace.package]
version = "0.16.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kepptic/ghax"
homepage = "https://github.com/kepptic/ghax"
authors = ["Kepptic <admin@kepptic.com>"]

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
