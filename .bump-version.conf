# Repo-local config for scripts/bump-version.sh. Sourced (not parsed) as a
# plain shell fragment — see the "Repo-local config" section of that
# script's header comment for precedence rules (CLI flags > this file >
# built-in defaults/auto-detect).
#
# ghax ships three components in lockstep: the Rust CLI (Cargo.toml, the
# source of truth), the Node daemon bundle (package.json /
# package-lock.json), and the bridge extension (extension/manifest.json).
# Auto-detect alone would only find Cargo.toml + package.json — list all
# four explicitly so every release keeps them aligned.
VERSION_FILES="Cargo.toml package.json package-lock.json extension/manifest.json"
