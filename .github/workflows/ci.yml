name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Runtime deps only (playwright, source-map); dev tooling is not shipped.
      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high

  # Both gates read the toolchain from rust-toolchain.toml.
  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p ghax --all-targets -- -D warnings

  # advisories, bans, licenses and sources, all from deny.toml.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  build:
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install deps
        run: npm ci
      - name: Build daemon bundle
        run: npm run build
      - name: Build Rust CLI
        run: cargo build --release --manifest-path crates/cli/Cargo.toml
      - name: Test Rust CLI
        if: runner.os == 'Linux'
        run: cargo test --manifest-path crates/cli/Cargo.toml
      - name: Stage Rust binary into dist/
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/ghax.exe dist/ghax.exe
          else
            cp target/release/ghax dist/ghax
          fi
      - name: Verify binaries (non-Windows)
        if: runner.os != 'Windows'
        run: |
          set -eo pipefail
          ./dist/ghax --help | head -5
          test -f dist/ghax-daemon.mjs
      - name: Verify binaries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eo pipefail
          ./dist/ghax.exe --help | head -5
          test -f dist/ghax-daemon.mjs
      # One artifact set per OS: the Node matrix only varies the daemon
      # build host, and identical names would collide.
      - name: Upload artifacts
        if: matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghax-${{ matrix.os }}
          path: |
            dist/ghax*
            dist/ghax-daemon.mjs
          retention-days: 14
