<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ghax bridge</title>
    <style>
      body {
        font: 13px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        width: 260px;
        padding: 12px;
        margin: 0;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #c62828;
        flex: none;
      }
      .dot.on {
        background: #2e7d32;
      }
      button {
        width: 100%;
        padding: 6px 8px;
        margin-bottom: 6px;
        cursor: pointer;
      }
      #tabInfo {
        font-size: 12px;
        color: #555;
        margin-top: 6px;
        word-break: break-all;
      }
      #err {
        color: #c62828;
        font-size: 12px;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <h1>ghax bridge</h1>
    <div class="row">
      <span id="dot" class="dot"></span>
      <span id="statusText">checking&hellip;</span>
    </div>
    <button id="controlBtn" type="button">Control this tab</button>
    <button id="stopBtn" type="button">Stop</button>
    <div id="tabInfo"></div>
    <div id="err"></div>
    <script src="popup.js"></script>
  </body>
</html>
