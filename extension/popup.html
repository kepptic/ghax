<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ghax bridge</title>
    <style>
      body {
        font: 13px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        width: 260px;
        padding: 12px;
        margin: 0;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #c62828;
        flex: none;
      }
      .dot.on {
        background: #2e7d32;
      }
      button {
        width: 100%;
        padding: 6px 8px;
        margin-bottom: 6px;
        cursor: pointer;
      }
      #tabInfo {
        font-size: 12px;
        color: #555;
        margin-top: 6px;
        word-break: break-all;
      }
      #err {
        color: #c62828;
        font-size: 12px;
        margin-top: 6px;
      }
      .dot.parked {
        background: #ef6c00;
      }
      #roleNote {
        font-size: 12px;
        color: #555;
        margin: -4px 0 10px;
        line-height: 1.4;
      }
      #roleNote code {
        background: #f0f0f0;
        padding: 1px 3px;
        border-radius: 3px;
        font-size: 11px;
      }
      .field {
        margin-top: 10px;
        border-top: 1px solid #e0e0e0;
        padding-top: 8px;
      }
      .field label {
        display: block;
        font-size: 11px;
        color: #666;
        margin-bottom: 3px;
      }
      .field input {
        width: 100%;
        box-sizing: border-box;
        padding: 4px 6px;
        font: inherit;
        font-size: 12px;
      }
      #saved {
        color: #2e7d32;
        font-size: 11px;
        margin-top: 4px;
        min-height: 13px;
      }
    </style>
  </head>
  <body>
    <h1>ghax bridge</h1>
    <div class="row">
      <span id="dot" class="dot"></span>
      <span id="statusText">checking&hellip;</span>
    </div>
    <div id="roleNote"></div>
    <button id="controlBtn" type="button">Control this tab</button>
    <button id="stopBtn" type="button">Stop</button>
    <div id="tabInfo"></div>
    <div id="err"></div>
    <div class="field">
      <label for="labelInput">Label (how <code>ghax bridge use</code> names this browser)</label>
      <input id="labelInput" type="text" placeholder="e.g. work-edge" />
      <label for="pairInput" style="margin-top:8px">Pairing code (only if ghax printed one)</label>
      <input id="pairInput" type="text" inputmode="numeric" placeholder="8-digit code" />
      <label for="portInput" style="margin-top:8px">Daemon port</label>
      <input id="portInput" type="number" placeholder="9223" />
      <div id="saved"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
